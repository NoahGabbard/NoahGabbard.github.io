<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="CSS/projects.css">
        <title>My Projects</title>
    </head>
    <body>
        <div id="back-arrow" title="Go Back" tabindex="0" aria-label="Go Back">
            &#8592;
        </div>
        <header>
            <h1>My Projects</h1>
        </header>
        <main>
            <section class="section">
                <h2>Projects</h2>
                <div id="projects"></div>
            </section>
        </main>
        <footer>
            <p>© 2025 Noah Gabbard</p>
        </footer>
        <script src="JavaScript/projects.js"></script>
        <script>
            // Fetch and display GitHub projects
            document.addEventListener('DOMContentLoaded', function() {
                const projectsContainer = document.getElementById('projects');
                fetch('https://api.github.com/users/NoahGabbard/repos')
                    .then(response => response.json())
                    .then(repos => {
                        repos.forEach(repo => {
                            const projectDiv = document.createElement('div');
                            projectDiv.className = 'item';
                            projectDiv.innerHTML = `
                                <h3>${repo.name}</h3>
                                <p>${repo.description || 'No description provided.'}</p>
                                <a href="${repo.html_url}" target="_blank">View Repository</a>
                            `;
                            projectsContainer.appendChild(projectDiv);
                        });
                    })
                    .catch(error => {
                        projectsContainer.innerHTML = '<p>Unable to load projects at this time.</p>';
                        console.error(error);
                    });
            });
        </script>
    </body>
</html>
