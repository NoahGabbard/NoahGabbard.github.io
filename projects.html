<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Noah Gabbard's GitHub projects and repositories." />
        <script>
            (function () {
                try {
                    var savedTheme = localStorage.getItem('theme');
                    var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    document.documentElement.setAttribute('data-theme', savedTheme || (systemDark ? 'dark' : 'light'));
                } catch (error) {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="CSS/projects.css?v=20260808-1" />
        <title>Projects — Noah Gabbard</title>
    </head>
    <body>
        <div id="back-arrow" title="Back to Resume" tabindex="0" aria-label="Go back to resume" role="button">&#8592;</div>

        <header>
            <h1>My Projects</h1>
            <p class="header-subtitle">A collection of work from my GitHub repositories</p>
        </header>

        <main>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" title="Switch to dark mode">Switch to Dark Mode</button>
            <div id="projects" aria-live="polite" aria-busy="true"></div>
        </main>

        <footer>
            <p>&copy; 2026 Noah Gabbard</p>
        </footer>

        <script src="JavaScript/projects.js?v=20260809-1"></script>
    </body>
</html>
